<!DOCTYPE html>
<html lang="ept-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
    <!-- logo provisório -->
    <div class="logo">
        <a href="index.html">
        <img src="logo_completo.png">
        </a>
    </div>

    <!-- campo de pesquisa -->
    <form class="pesquisa">
        <input type="search" placeholder="Pesquisar arte/artista" class="campo_pesquisa">
        <button type="submit" class="botao_padrao">Pesquisar</button>    
    </form>

    <!-- menuzinho lateral -->
    <div class="menu">
        <button class="botao_menu">
            <img src="icones/botao_menu.svg" alt="Menu" class="icone_menu">
            </button>

            <ul class="lista_menu" id="lista_menu">
                <li class="opcao_menu">
                    <a class="link_menu" href="entrar.html">
                    <img src="icones/icone_menu_entrar.svg" class="icone_opcao_menu">Entrar
                    </a>
                </li>
                <li class="opcao_menu">
                    <a class="link_menu" href="galeria.html">
                    <img src="icones/icone_menu_galeria.svg" class="icone_opcao_menu">Minha Galeria
                    </a>
                </li>
                <li class="opcao_menu">
                    <a class="link_menu" href="sair.html">
                    <img src="icones/icone_menu_sair.svg" class="icone_opcao_menu">Sair
                    </a>
                </li>

            </ul>
    </div>

</header>

    <main class="conteudo_principal">
        <section class="caixa_formulario">
            <h2 class="titulo_formulario">Editar Perfil de Artista</h2>
            
            <form class="formulario">
                <div class="grupo_campo">
                    <label for="nome_artista" class="rotulo_campo">Nome de Exibição / Artístico</label>
                    <input type="text" id="nome_artista" class="campo_input" value="Nome do Artista" required>
                </div>

                <div class="grupo_campo">
                    <label for="foto_perfil" class="rotulo_campo">Alterar Foto de Perfil</label>
                    <input type="file" id="foto_perfil" class="campo_input_file">
                </div>

                <div class="grupo_campo">
                    <label for="bio_artista" class="rotulo_campo">Sobre Você</label>
                    <textarea id="bio_artista" class="campo_textarea" rows="4" placeholder="Descreva sua trajetória ou estilo"></textarea>
                </div>

                <button type="submit" class="botao_padrao">Salvar Alterações</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="sobre">
            <a href="about.html">Sobre o Acervo</a>
        </div>
        <div class="contato">
            <a href="link instagram" aria-label="Instagram">
                <img src="icon_instagram.svg" alt="Instagram">
            </a>
            <a href="link email" aria-label="E-mail">
                <img src="icon_email.svg" alt="E-mail">
            </a>
        </div>
    </footer>
    
</body>
</html>
