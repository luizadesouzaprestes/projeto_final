services:
  php:
    build: .
    container_name: acervo_totem_web
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.3
    container_name: acervo_totem_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: acervo_totem
    ports:
      - "3306:3306"
    volumes:
      - totem_db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: acervo_totem_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: 1234
    depends_on:
      - mysql

volumes:
  totem_db_data: