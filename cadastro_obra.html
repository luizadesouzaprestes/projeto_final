<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Obra</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>

<header>
    <!-- logo provisório -->
    <div class="logo">
        <a href="index.html">
        <img src="logo_completo.png">
        </a>
    </div>

    <!-- campo de pesquisa -->
    <form class="pesquisa">
        <input type="search" placeholder="Pesquisar arte/artista" class="campo_pesquisa">
        <button type="submit" class="botao_padrao">Pesquisar</button>    
    </form>

    <!-- menuzinho lateral -->
    <div class="menu">
        <button class="botao_menu">
            <img src="icones/botao_menu.svg" alt="Menu" class="icone_menu">
            </button>

            <ul class="lista_menu" id="lista_menu">
                <li class="opcao_menu">
                    <a class="link_menu" href="entrar.html">
                    <img src="icones/icone_menu_entrar.svg" class="icone_opcao_menu">Entrar
                    </a>
                </li>
                <li class="opcao_menu">
                    <a class="link_menu" href="galeria.html">
                    <img src="icones/icone_menu_galeria.svg" class="icone_opcao_menu">Minha Galeria
                    </a>
                </li>
                <li class="opcao_menu">
                    <a class="link_menu" href="sair.html">
                    <img src="icones/icone_menu_sair.svg" class="icone_opcao_menu">Sair
                    </a>
                </li>

            </ul>
    </div>

</header>

<main class="conteudo_principal">
    <section class="caixa_formulario">
        <h3 class="titulo_formulario">Adicionar Nova Obra</h3>
        
        <form class="formulario">
            <div class="grupo_campo">
                <label for="titulo_obra" class="rotulo_campo">Nome da Obra</label>
                <input type="text" id="titulo_obra" class="campo_input" placeholder="Ex: Estudo de Formas" required>
            </div>

            <div class="grupo_campo">
                <label for="imagem_obra_input" class="rotulo_campo">Selecione a Imagem (PNG)</label>
                <input type="file" id="imagem_obra_input" class="campo_input_file" required>
            </div>

            <div class="grupo_campo">
                <label for="descricao_obra" class="rotulo_campo">Descrição da Obra</label>
                <textarea id="descricao_obra" class="campo_textarea" rows="4" placeholder="Descreva o conceito, técnica ou contexto."></textarea>
            </div>

            <button type="submit" class="botao_padrao">Publicar Obra</button>
        </form>
    </section>
</main>

<footer>
    <div class="sobre">
        <a href="about.html">Sobre o Acervo</a>
    </div>
    <div class="contato">
        <a href="link instagram" aria-label="Instagram">
            <img src="icones/icon_instagram.svg" alt="Instagram">
        </a>
        <a href="link email" aria-label="E-mail">
            <img src="icones/icon_email.svg" alt="E-mail">
        </a>
    </div>
</footer>

</body>
</html>
